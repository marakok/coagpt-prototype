<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COAGPT · Prototype intake en werkruimte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Shelter v2.1.0 tokens, overgenomen van mxds.nl (light theme).
   Namen volgen Figma (background/foreground/border); op mxds.nl
   heten ze --sh-bg-*, --sh-fg-*, --sh-border-*.
   ========================================================= */
:root{
  --sh-petrol-50:#e5ffff; --sh-petrol-250:#83def2; --sh-petrol-450:#2ea1b8; --sh-petrol-500:#0094ab;
  --sh-petrol-550:#008197; --sh-petrol-600:#006f85; --sh-petrol-650:#005f74; --sh-petrol-700:#004e63;
  --sh-petrol-800:#00384a; --sh-petrol-900:#002535;

  --sh-background-neutral:#f7f8f8;
  --sh-background-neutral-raised:#ffffff;
  --sh-background-neutral-faded:#e9ebec;
  --sh-background-neutral-muted:#dbe0e2;
  --sh-background-neutral-inverted:#002535;
  --sh-background-primary:#2ea1b8;
  --sh-background-primary-faded:#006f85;
  --sh-background-primary-raised:#e5ffff;
  --sh-background-constructive:#41a960;
  --sh-background-constructive-faded:#00772f;
  --sh-background-constructive-raised:#e0ffe9;
  --sh-background-attention:#be8c0b;
  --sh-background-attention-raised:#fffcdb;
  --sh-background-destructive:#f25342;
  --sh-background-destructive-faded:#b80300;
  --sh-background-destructive-raised:#ffeee5;
  --sh-background-accent1-raised:#fff0ff;

  --sh-foreground-neutral-prominent:#12171a;
  --sh-foreground-neutral:#282f32;
  --sh-foreground-neutral-faded:#4b5357;
  --sh-foreground-neutral-muted:#6b7478;
  --sh-foreground-neutral-inverted:#f7f8f8;
  --sh-foreground-primary:#008197;
  --sh-foreground-primary-prominent:#004e63;
  --sh-foreground-constructive:#0d8940;
  --sh-foreground-constructive-prominent:#005510;
  --sh-foreground-attention:#986800;
  --sh-foreground-attention-prominent:#623800;
  --sh-foreground-destructive:#d32a1d;
  --sh-foreground-destructive-prominent:#8e0000;
  --sh-foreground-accent1:#8360a1;
  --sh-foreground-accent1-prominent:#51316b;

  --sh-border-neutral:#dbe0e2;
  --sh-border-neutral-faded:#e9ebec;
  --sh-border-neutral-prominent:#c8cfd2;
  --sh-border-neutral-contrast:#12171a;
  --sh-border-primary:#0094ab;
  --sh-border-constructive:#24984d;
  --sh-border-attention:#aa7a00;

  --sh-action-hover-inverse:#00000008;
  --sh-action-active-inverse:#0000001a;
  --sh-opacity-dark-50:#00000080;

  --sh-radius-xs:4px; --sh-radius-sm:6px; --sh-radius-md:8px; --sh-radius-lg:10px; --sh-radius-xl:12px; --sh-radius-full:9999px;
  --sh-levitation-1:0 2px 3px 0 rgba(0,0,0,.1);
  --sh-levitation-2:0 4px 16px 0 rgba(0,0,0,.03),0 4px 6px 0 rgba(0,0,0,.03);
  --sh-levitation-3:0 4px 16px 0 rgba(0,0,0,.03),0 6px 8px 0 rgba(0,0,0,.03);
  --sh-levitation-4:0 4px 16px 0 rgba(0,0,0,.03),0 10px 12px 0 rgba(0,0,0,.03);
  --sh-levitation-5:0 4px 16px 0 rgba(0,0,0,.03),0 14px 16px 0 rgba(0,0,0,.1);
  --sh-focus:#008197;

  --sh-font-header:'Supreme','Noto Sans',system-ui,sans-serif;
  --sh-font-body:'Noto Sans',system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sh-font-body);font-size:16px;line-height:24px;color:var(--sh-foreground-neutral);background:var(--sh-background-neutral);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sh-focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Typografie: headings Supreme 500, body Noto Sans */
.h1,.h2,.h3,.h4,.h5{margin:0;font-family:var(--sh-font-header);font-weight:500;color:var(--sh-foreground-neutral-prominent)}
.h1{font-size:40px;line-height:44px}
.h2{font-size:32px;line-height:36px}
.h3{font-size:24px;line-height:28px}
.h4{font-size:20px;line-height:24px}
.h5{font-size:16px;line-height:20px}
.lead{margin:0;font-size:20px;line-height:28px;color:var(--sh-foreground-neutral-faded)}
.label{font-size:14px;line-height:20px}
.label-sm{font-size:12px;line-height:16px}
.overline{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sh-foreground-primary)}
.faded{color:var(--sh-foreground-neutral-faded)}

/* Buttons */
.sh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--sh-radius-xl);border:1px solid transparent;font-size:16px;line-height:24px;font-weight:500;white-space:nowrap;transition:background .15s}
.sh-btn--primary{background:var(--sh-background-primary-faded);color:#fff}
.sh-btn--primary:hover{background:var(--sh-petrol-650)}
.sh-btn--secondary{background:var(--sh-background-neutral-raised);border-color:var(--sh-border-neutral-faded);color:var(--sh-foreground-neutral-prominent)}
.sh-btn--secondary:hover{background:var(--sh-background-neutral);border-color:var(--sh-border-neutral-prominent)}
.sh-btn--ghost{background:transparent;color:var(--sh-foreground-primary-prominent)}
.sh-btn--ghost:hover{background:var(--sh-action-hover-inverse)}
.sh-btn--sm{min-height:36px;padding:0 12px;border-radius:var(--sh-radius-md);font-size:14px}
.sh-icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--sh-radius-md);border:0;background:transparent;color:var(--sh-foreground-neutral-faded)}
.sh-icon-btn:hover{background:var(--sh-action-hover-inverse);color:var(--sh-foreground-neutral-prominent)}

/* Chips */
.sh-chip{display:inline-flex;align-items:center;gap:2px;height:24px;padding:4px 8px;border-radius:var(--sh-radius-full);font-size:12px;font-weight:500;line-height:16px;white-space:nowrap}
.sh-chip--neutral{background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral-faded);color:var(--sh-foreground-neutral-prominent)}
.sh-chip--primary{background:var(--sh-background-primary-raised);color:var(--sh-foreground-primary-prominent)}
.sh-chip--constructive{background:var(--sh-background-constructive-raised);color:var(--sh-foreground-constructive-prominent)}
.sh-chip--attention{background:var(--sh-background-attention-raised);color:var(--sh-foreground-attention-prominent)}
.sh-chip--accent1{background:var(--sh-background-accent1-raised);color:var(--sh-foreground-accent1-prominent)}
.sh-chip--neutral-raised{background:var(--sh-background-neutral);border:1px solid var(--sh-border-neutral-faded);color:var(--sh-foreground-neutral-prominent)}
.sh-chip--solid{background:var(--sh-foreground-neutral-prominent);color:var(--sh-foreground-neutral-inverted)}

/* Suggestion chip (selecteerbaar) */
.sh-suggest{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--sh-radius-full);border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);color:var(--sh-foreground-neutral-prominent);font-size:15px;font-weight:500;text-align:left}
.sh-suggest:hover{border-color:var(--sh-border-neutral-prominent)}
.sh-suggest[aria-pressed="true"]{background:var(--sh-background-primary-faded);border-color:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted)}
.sh-suggest--quiet{min-height:36px;padding:8px 16px;border-color:var(--sh-border-neutral);font-size:14px;color:var(--sh-foreground-neutral-faded)}
.sh-suggest--quiet:hover{color:var(--sh-foreground-neutral-prominent)}

/* Inputs */
.sh-field{display:flex;flex-direction:column;gap:8px}
.sh-field label{font-size:14px;line-height:20px;font-weight:600;color:var(--sh-foreground-neutral-prominent)}
.sh-input{min-height:48px;padding:4px 12px;border-radius:var(--sh-radius-xl);border:1px solid var(--sh-border-neutral-faded);background:var(--sh-background-neutral);font-size:16px;color:var(--sh-foreground-neutral-prominent)}
.sh-input:hover{border-color:var(--sh-border-neutral-prominent)}
.sh-input:focus{outline:none;border:2px solid var(--sh-focus);background:var(--sh-background-neutral-raised);padding:3px 11px}
textarea.sh-input{padding:8px 12px 4px;resize:vertical;line-height:24px}
textarea.sh-input:focus{padding:7px 11px 3px}
.sh-desc{font-size:12px;line-height:16px;color:var(--sh-foreground-neutral-faded);padding-top:4px}

/* Progress */
.sh-progress{display:flex;align-items:center;gap:12px}
.sh-progress__track{flex:1;height:8px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral-muted);overflow:hidden}
.sh-progress__fill{height:100%;border-radius:var(--sh-radius-full);background:var(--sh-background-primary);transition:width .3s}
.sh-progress__fill--done{background:var(--sh-background-constructive)}
.sh-progress__pct{width:36px;text-align:right;font-size:12px;font-weight:600;color:var(--sh-foreground-neutral-faded)}

/* Stepper (Shelter 2.0: current / next / done) */
.sh-stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sh-step{display:flex;align-items:center;gap:12px;min-width:0}
.sh-step__dot{width:32px;height:32px;border-radius:var(--sh-radius-full);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.sh-step--current .sh-step__dot{background:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted)}
.sh-step--next .sh-step__dot{background:var(--sh-background-neutral-faded);color:var(--sh-foreground-neutral-faded)}
.sh-step--done .sh-step__dot{background:var(--sh-background-constructive);color:var(--sh-foreground-neutral-inverted)}
.sh-step__label{font-size:16px;line-height:20px;font-weight:600;color:var(--sh-foreground-neutral-prominent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-step--next .sh-step__label{color:var(--sh-foreground-neutral-faded);font-weight:500}
.sh-step__line{flex:1;height:2px;background:var(--sh-border-neutral-faded);min-width:12px}
.sh-step--done .sh-step__line{background:var(--sh-background-constructive)}

/* Option card (Action card list) */
.opt{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--sh-radius-md);border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);text-align:left;min-height:168px;transition:box-shadow .15s,border-color .15s}
.opt:hover{box-shadow:var(--sh-levitation-1);border-color:var(--sh-border-neutral)}
.opt[aria-pressed="true"]{border:2px solid var(--sh-border-primary);padding:19px;background:var(--sh-background-neutral-raised)}
.opt__icon{width:40px;height:40px;border-radius:var(--sh-radius-xs);display:flex;align-items:center;justify-content:center;background:var(--sh-background-neutral);color:var(--sh-foreground-neutral-faded)}
.opt[aria-pressed="true"] .opt__icon{background:var(--sh-background-primary-raised);color:var(--sh-foreground-primary-prominent)}
.opt__check{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:var(--sh-radius-full);background:var(--sh-background-primary-faded);color:#fff;display:none;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .opt__check{display:flex}

/* ================== INTAKE ================== */
.intake{display:flex;flex-wrap:wrap;min-height:100vh}
.intake__aside{flex:1 1 380px;max-width:100%;background:var(--sh-petrol-900);color:#fff;padding:32px 40px 40px;display:flex;flex-direction:column;gap:32px}
.intake__main{flex:999 1 600px;min-width:0;background:var(--sh-background-neutral-raised);padding:32px 56px 32px;display:flex;flex-direction:column;gap:40px}
.intake__body{flex:1;max-width:800px;display:flex;flex-direction:column;gap:32px}
.intake__foot{max-width:800px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--sh-border-neutral-faded);padding-top:24px}
.brand{display:flex;align-items:center;gap:10px}
.brand__mark{display:flex;align-items:center}
.brand__name{font-family:var(--sh-font-header);font-size:20px;line-height:28px;font-weight:800}

.pv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--sh-radius-xl);padding:24px;display:flex;flex-direction:column;gap:20px}
.pv__label{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.pv__row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--sh-radius-lg);background:rgba(255,255,255,.08);font-size:14px;line-height:20px}
.pv__ghost{height:40px;border-radius:var(--sh-radius-lg);border:1px dashed rgba(255,255,255,.22)}
.pv__app{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--sh-radius-full);background:#fff;color:var(--sh-petrol-900);font-size:13px;font-weight:700;letter-spacing:.03em}
.avatar{width:48px;height:48px;border-radius:var(--sh-radius-full);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.app-tile{min-height:64px;justify-content:center;border-radius:var(--sh-radius-lg);font-weight:700;letter-spacing:.04em;font-size:16px}

/* ================== BOUWEN ================== */
.build{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--sh-petrol-900)}
.build__card{width:100%;max-width:560px;background:var(--sh-background-neutral-raised);border-radius:var(--sh-radius-xl);box-shadow:var(--sh-levitation-5);padding:40px;display:flex;flex-direction:column;gap:28px}
.vstep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vstep li{display:flex;gap:16px;position:relative;padding-bottom:20px}
.vstep li:last-child{padding-bottom:0}
.vstep li:not(:last-child)::after{content:"";position:absolute;left:15px;top:36px;bottom:4px;width:2px;background:var(--sh-border-neutral-faded)}
.vstep li.sh-step--done:not(:last-child)::after{background:var(--sh-background-constructive)}
.vstep .txt{padding-top:4px;font-size:16px;line-height:24px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================== WERKRUIMTE ================== */
.ws{display:flex;flex-wrap:wrap;min-height:100vh}
.sidenav{flex:0 1 256px;min-width:232px;max-width:100%;background:var(--sh-background-neutral-raised);border-right:1px solid var(--sh-border-neutral-faded);padding:16px 12px;display:flex;flex-direction:column;gap:0}
.sidenav__group{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--sh-border-neutral-faded)}
.sidenav__group--first{border-top:0;padding-top:8px}
.sidenav__title{padding:4px 8px 6px;font-size:12px;line-height:16px;font-weight:500;color:var(--sh-foreground-neutral-faded)}
.sh-navitem{display:flex;align-items:center;gap:12px;width:100%;min-height:36px;padding:8px;border-radius:var(--sh-radius-md);border:0;background:transparent;color:var(--sh-foreground-neutral);font-size:16px;line-height:20px;font-weight:500;text-align:left}
.sh-navitem:hover{background:var(--sh-action-hover-inverse);color:var(--sh-foreground-neutral-prominent)}
.sh-navitem[aria-current="page"]{background:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted)}
.sh-navitem[aria-current="page"] .lock{color:rgba(255,255,255,.8)}
.sidenav__brand{padding:4px 8px 16px}
.sidenav__new{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 8px;margin-bottom:4px;border-radius:var(--sh-radius-md);border:1px solid var(--sh-border-neutral-faded);background:var(--sh-background-neutral-raised);color:var(--sh-foreground-neutral-prominent);font-size:16px;line-height:20px;font-weight:500;text-align:left}
.sidenav__new:hover{background:var(--sh-background-neutral);border-color:var(--sh-border-neutral-prominent)}
.sidenav__new svg{color:var(--sh-foreground-primary)}
.sh-navitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-navitem--sub{font-size:14px;line-height:20px;font-weight:400;padding:8px 8px 8px 38px}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral-faded);color:var(--sh-foreground-neutral-faded);font-size:12px;line-height:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.sh-navitem .lock{color:var(--sh-foreground-neutral-muted);display:inline-flex}
.sh-navitem[aria-current="page"] .count{background:rgba(255,255,255,.2);color:#fff}

.main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column}
.topnav{height:48px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--sh-background-neutral-raised);border-bottom:1px solid var(--sh-border-neutral-faded)}
.topnav__search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border-radius:var(--sh-radius-xl);background:var(--sh-background-neutral);border:1px solid var(--sh-border-neutral-faded);color:var(--sh-foreground-neutral-faded);font-size:14px}
.keycap{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:6px;border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);font-size:11px;font-weight:600;color:var(--sh-foreground-neutral-faded)}
.topnav__spacer{flex:1}
.mini-avatar{width:32px;height:32px;border-radius:var(--sh-radius-full);background:var(--sh-background-primary-raised);color:var(--sh-foreground-primary-prominent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.home{width:100%;max-width:1200px;margin:0 auto;padding:40px 32px 64px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px 20px}
.home__main{grid-column:span 8;display:flex;flex-direction:column;gap:32px;min-width:0}
.home__side{grid-column:span 4;display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1100px){.home__main,.home__side{grid-column:1 / -1}}

.insight{background:var(--sh-background-primary-raised);border-left:2px solid var(--sh-border-primary);border-radius:var(--sh-radius-xl);padding:16px;display:flex;gap:12px;align-items:flex-start}
.ai-input{background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral);border-radius:var(--sh-radius-xl);box-shadow:var(--sh-levitation-3);padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.ai-input:focus-within{border-color:var(--sh-focus)}
.ai-input textarea{width:100%;border:0;resize:none;background:transparent;font-size:18px;line-height:28px;color:var(--sh-foreground-neutral-prominent);outline:none;padding:0}
.ai-input textarea::placeholder{color:var(--sh-foreground-neutral-faded)}
.ai-input__bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.send{width:44px;height:44px;border-radius:var(--sh-radius-md);border:0;background:var(--sh-background-primary-faded);color:#fff;display:flex;align-items:center;justify-content:center}
.send:hover{background:var(--sh-petrol-650)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cards,.grid-3{grid-template-columns:1fr}.grid-5{grid-template-columns:repeat(3,minmax(0,1fr))}.intake__main{padding:24px}.sh-stepper .sh-step__label{display:none}}
.action-card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--sh-radius-md);border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);text-align:left;min-height:148px;transition:box-shadow .15s}
.action-card:hover{box-shadow:var(--sh-levitation-1)}
.action-card__top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.icon-container{width:40px;height:40px;border-radius:var(--sh-radius-xs);display:flex;align-items:center;justify-content:center;background:var(--sh-background-accent1-raised);color:var(--sh-foreground-accent1-prominent)}

.panel{background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral);border-radius:var(--sh-radius-md);padding:20px;display:flex;flex-direction:column;gap:14px}
.item{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--sh-radius-lg);background:var(--sh-background-neutral)}
.lp{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;border-radius:var(--sh-radius-lg);border:1px solid var(--sh-border-neutral-faded);background:var(--sh-background-neutral-raised);text-align:left}
.lp:hover{background:var(--sh-background-neutral)}
.lp[disabled]{cursor:default}
.lp[disabled]:hover{background:var(--sh-background-neutral-raised)}

/* Chat */
.chat{flex:1;display:flex;flex-direction:column}
.chat__scroll{flex:1;width:100%;max-width:800px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:24px}
.bubble-out{align-self:flex-end;max-width:80%;padding:8px 12px;border-radius:var(--sh-radius-xl) 0 var(--sh-radius-xl) var(--sh-radius-xl);background:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted);box-shadow:var(--sh-levitation-1)}
.msg-in{display:flex;gap:14px;align-items:flex-start}
.ai-avatar{width:32px;height:32px;border-radius:var(--sh-radius-full);flex:none;background:radial-gradient(140% 120% at 40% 0,#fff 0,#f2f9fa 30%,#c8e5eb 58%,#95ceda 82%,#61b8c9 100%);box-shadow:0 0 0 1px rgba(46,161,184,.18)}
.ai-avatar svg{display:none}
.ai-avatar--thinking{animation:orb 1.6s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 0 6px rgba(46,161,184,.22)}}
.msg-in__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.msg-text{color:var(--sh-foreground-neutral-prominent);line-height:26px}
.ph{display:inline-block;padding:0 6px;border-radius:var(--sh-radius-sm);background:var(--sh-background-neutral-muted);color:var(--sh-foreground-neutral-faded);font-size:14px;line-height:22px}
.tool{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:28px;padding:0 10px;border-radius:var(--sh-radius-md);background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral-faded);font-size:13px;color:var(--sh-foreground-neutral-faded)}
.cite{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:24px;padding:0 8px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral);border:1px solid var(--sh-border-neutral-faded);color:var(--sh-foreground-neutral-prominent);font-size:12px;font-weight:500}
.feedback{display:flex;gap:4px;margin-left:-8px}
.feedback .sh-icon-btn{width:36px;height:36px}
.dots{display:inline-flex;gap:4px;align-self:flex-start;padding:12px 16px;border-radius:0 var(--sh-radius-xl) var(--sh-radius-xl) var(--sh-radius-xl);background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral);box-shadow:var(--sh-levitation-1)}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sh-foreground-neutral-muted);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}

.sh-alert{border-radius:var(--sh-radius-xl);background:var(--sh-background-attention-raised);padding:16px;display:flex;flex-direction:column;gap:14px}
.sh-alert__head{display:flex;gap:12px;align-items:flex-start}
.sh-alert--ok{background:var(--sh-background-constructive-raised);color:var(--sh-foreground-constructive-prominent);flex-direction:row;align-items:center;gap:10px;font-weight:600}

.chat__foot{width:100%;max-width:800px;margin:0 auto;padding:0 32px 24px}
.chat__foot .ai-input{padding:8px 8px 8px 16px;flex-direction:row;align-items:flex-end}
.chat__foot textarea{font-size:16px;line-height:24px;padding:10px 0}
.disclaimer{margin:10px 0 0;text-align:center;font-size:12px;line-height:16px;color:var(--sh-foreground-neutral-faded)}

/* Drawer (e-learning) */
.scrim{position:fixed;inset:0;background:var(--sh-opacity-dark-50);display:flex;justify-content:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{width:100%;max-width:552px;height:100%;background:var(--sh-background-neutral-raised);border-radius:var(--sh-radius-xl) 0 0 var(--sh-radius-xl);box-shadow:var(--sh-levitation-5);display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.drawer__head{padding:24px;border-bottom:1px solid var(--sh-border-neutral-faded);display:flex;flex-direction:column;gap:16px}
.drawer__body{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.drawer__foot{padding:16px 24px;border-top:1px solid var(--sh-border-neutral-faded);display:flex;justify-content:space-between;gap:12px}
.slide-hero{border-radius:var(--sh-radius-xl);background:var(--sh-petrol-900);color:#fff;padding:28px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.quiz-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border-radius:var(--sh-radius-md);border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);text-align:left;font-size:16px}
.quiz-opt:hover{border-color:var(--sh-border-neutral-prominent)}
.quiz-opt .l{width:28px;height:28px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.quiz-opt.ok{border:2px solid var(--sh-background-constructive);background:var(--sh-background-constructive-raised);padding:7px 15px}
.quiz-opt.ok .l{background:var(--sh-background-constructive);color:#fff}
.quiz-opt.no{border:2px solid var(--sh-background-destructive);background:var(--sh-background-destructive-raised);padding:7px 15px}
.quiz-opt.no .l{background:var(--sh-background-destructive);color:#fff}


/* Pagina's */
.page{width:100%;max-width:1200px;margin:0 auto;padding:32px 32px 96px;display:flex;flex-direction:column;gap:24px}
.page__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grid-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-cards--4{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.grid-cards,.grid-cards--4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid-cards,.grid-cards--4{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral);border-radius:var(--sh-radius-md);overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) 120px auto;align-items:center;gap:16px;min-height:64px;padding:12px 16px;border:0;border-bottom:1px solid var(--sh-border-neutral-faded);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row--btn:hover{background:var(--sh-action-hover-inverse)}
.row--doc{grid-template-columns:minmax(0,1fr) 200px 160px 96px}
.row--btn.row--doc{grid-template-columns:minmax(0,1fr) 200px 160px 24px}
.row--kb{grid-template-columns:36px minmax(0,1fr) auto 24px}
.row--btn:not(.row--doc):not(.row--kb){grid-template-columns:28px minmax(0,1fr) auto 24px}
.row--head{min-height:40px;padding:8px 16px;background:var(--sh-background-neutral);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sh-foreground-neutral-faded)}
.row__actions{display:flex;align-items:center;gap:4px;justify-content:flex-end}
@media (max-width:760px){.row,.row--doc,.row--btn.row--doc{grid-template-columns:1fr !important;gap:6px}.row--head{display:none}}
.doc-ic,.chat-ic{width:36px;height:36px;border-radius:var(--sh-radius-xs);display:flex;align-items:center;justify-content:center;background:var(--sh-background-primary-raised);color:var(--sh-foreground-primary-prominent);flex:none}
.chat-ic{width:28px;height:28px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral);color:var(--sh-foreground-neutral-faded)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--sh-foreground-neutral-faded)}
.app-logo{display:flex;align-items:center;justify-content:center;width:100%;height:72px;border-radius:var(--sh-radius-md);background:var(--sh-background-neutral-inverted);color:#fff;font-weight:700;letter-spacing:.06em;font-size:18px}
.doc-preview{display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid var(--sh-border-neutral);border-radius:var(--sh-radius-md);background:var(--sh-background-neutral-raised);box-shadow:var(--sh-levitation-1)}
.sk{display:block;height:10px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral-faded)}

/* Tabbar (Shelter: geselecteerd = gevulde pill) */
.sh-tabbar{display:flex;gap:8px;flex-wrap:wrap}
.sh-tab{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--sh-radius-md);border:0;background:transparent;color:var(--sh-foreground-neutral);font-size:15px;font-weight:500}
.sh-tab:hover{background:var(--sh-action-hover-inverse)}
.sh-tab[aria-selected="true"]{background:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted)}
.sh-tab__n{font-size:12px;opacity:.8}

/* Switch */
.sh-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.sh-switch input{position:absolute;opacity:0;width:44px;height:24px;margin:0;cursor:pointer}
.sh-switch__track{width:44px;height:24px;border-radius:var(--sh-radius-full);background:var(--sh-background-neutral-muted);position:relative;transition:background .15s}
.sh-switch__track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--sh-levitation-1);transition:transform .15s}
.sh-switch input:checked + .sh-switch__track{background:var(--sh-background-primary-faded)}
.sh-switch input:checked + .sh-switch__track::after{transform:translateX(20px)}
.sh-switch input:focus-visible + .sh-switch__track{outline:2px solid var(--sh-focus);outline-offset:2px}

/* Toast */
.sh-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--sh-radius-xl);background:var(--sh-background-neutral-inverted);color:#fff;font-size:15px;box-shadow:var(--sh-levitation-5);animation:pop .25s ease}


/* ===== Intake als gesprek ===== */
.intake__main{padding:0 !important;gap:0 !important;height:100vh;min-height:640px;position:sticky;top:0}
@media (max-width:980px){.intake__main{height:auto;position:static}}
.intake__top{padding:20px 40px;border-bottom:1px solid var(--sh-border-neutral-faded);background:var(--sh-background-neutral-raised)}
.ichat{flex:1;overflow:auto;padding:32px 40px;display:flex;flex-direction:column;gap:20px;background:var(--sh-background-neutral);scroll-behavior:smooth}
.ichat > *{max-width:760px;width:100%}
.intake__foot{padding:16px 40px 24px;background:var(--sh-background-neutral);border-top:1px solid var(--sh-border-neutral-faded)}
.intake__foot > *{max-width:760px}
.ai-input--row{flex-direction:row !important;align-items:center;padding:6px 6px 6px 16px !important;gap:8px}
.ai-input--row input{flex:1;border:0;outline:none;background:transparent;font-size:16px;line-height:24px;padding:10px 0;color:var(--sh-foreground-neutral-prominent);min-width:0}
.ai-input--row input::placeholder{color:var(--sh-foreground-neutral-faded)}
.ai-input--disabled{background:var(--sh-background-neutral-faded) !important;box-shadow:none !important;border-color:var(--sh-border-neutral-faded) !important}
.sh-desc--error{color:var(--sh-foreground-destructive)}
.intake__foot .sh-desc{margin:8px 0 0 4px}

/* Chat bubbles (Shelter) */
.bubble-in{align-self:flex-start;max-width:100%;padding:12px 16px;border-radius:0 var(--sh-radius-xl) var(--sh-radius-xl) var(--sh-radius-xl);background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral);box-shadow:var(--sh-levitation-1);color:var(--sh-foreground-neutral-prominent);line-height:24px}
.bubble-in strong{font-weight:600}
.out-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:flex-end}
.out-wrap .bubble-out{max-width:100%}
.ichat .out-wrap{max-width:560px}
.link-btn{border:0;background:transparent;padding:4px 6px;font-size:13px;font-weight:500;color:var(--sh-foreground-primary);text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--sh-foreground-primary-prominent)}
.link-btn--inv{color:rgba(255,255,255,.85)}
.link-btn--inv:hover{color:#fff}

/* Suggested prompts (Shelter) */
.sh-prompts{display:flex;flex-wrap:wrap;gap:8px}
.sh-prompt{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:8px 16px;border-radius:var(--sh-radius-full);border:1px solid var(--sh-border-neutral);background:var(--sh-background-neutral-raised);color:var(--sh-foreground-neutral-prominent);font-size:14px;line-height:20px;text-align:left;transition:border-color .12s,background .12s}
.sh-prompt:hover{border-color:var(--sh-border-neutral-prominent);background:var(--sh-background-neutral)}
.sh-prompt[aria-pressed="true"]{background:var(--sh-background-primary-faded);border-color:var(--sh-background-primary-faded);color:var(--sh-foreground-neutral-inverted)}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.role-grid{grid-template-columns:1fr}}
.opt--sm{min-height:0 !important;flex-direction:row !important;align-items:center;gap:12px !important;padding:12px !important}
.opt--sm[aria-pressed="true"]{padding:11px !important}

/* Tool call indicator (Shelter: done / running / pending) */
.sh-tools{display:flex;flex-direction:column;gap:6px}
.sh-tool{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:28px;padding:4px 10px;border-radius:var(--sh-radius-md);background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral-faded);font-size:13px;line-height:20px;color:var(--sh-foreground-neutral-faded)}
.sh-tool--done{color:var(--sh-foreground-neutral-prominent)}
.sh-tool--done svg{color:var(--sh-foreground-constructive)}
.sh-tool--running{color:var(--sh-foreground-neutral-prominent);border-color:var(--sh-border-primary)}
.sh-tool--running svg{color:var(--sh-foreground-primary)}
.sh-tool--pending{opacity:.7}
.mini-task{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px 16px;border-radius:var(--sh-radius-xl);background:var(--sh-background-neutral-raised);border:1px solid var(--sh-border-neutral)}

/* Coach mark (Shelter tooltip, inverted) */
.sh-coach{position:absolute;z-index:26;width:280px;padding:16px;border-radius:var(--sh-radius-md);background:var(--sh-background-neutral-inverted);color:#fff;box-shadow:var(--sh-levitation-5);display:flex;flex-direction:column;gap:6px;animation:pop .25s ease}
.sh-coach strong{font-family:var(--sh-font-header);font-weight:500;font-size:18px;line-height:24px;outline:none}
.sh-coach__arrow{position:absolute;width:12px;height:12px;background:var(--sh-background-neutral-inverted);transform:rotate(45deg)}
.sh-coach--right{left:calc(100% + 18px);top:0}
.sh-coach--right .sh-coach__arrow{left:-6px;top:18px}
.sh-coach--left{right:calc(100% + 18px);top:0}
.sh-coach--left .sh-coach__arrow{right:-6px;top:18px}
@media (max-width:1100px){.sh-coach--left,.sh-coach--right{left:0;right:auto;top:calc(100% + 12px)}.sh-coach__arrow{display:none}}
.sh-coach__foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.sh-btn--inv{background:#fff;color:var(--sh-background-neutral-inverted)}
.sh-btn--inv:hover{background:var(--sh-petrol-50)}
.sidenav{position:relative;z-index:5;overflow:visible}

/* Checklist */
.cl{display:flex;flex-direction:column;gap:2px}
.cl-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px;border:0;border-radius:var(--sh-radius-md);background:transparent;text-align:left}
.cl-item:hover{background:var(--sh-action-hover-inverse)}
.cl-item.is-done{cursor:default}
.cl-item.is-done:hover{background:transparent}
.cl-dot{width:28px;height:28px;border-radius:var(--sh-radius-full);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--sh-background-neutral-faded);color:var(--sh-foreground-neutral-faded)}
.cl-item.is-done .cl-dot{background:var(--sh-background-constructive-faded);color:#fff}
.cl-t{font-weight:500;color:var(--sh-foreground-neutral-prominent);font-size:15px;line-height:22px}
.cl-item.is-done .cl-t{color:var(--sh-foreground-neutral-faded);text-decoration:line-through}
.tip-li{display:flex;gap:10px;align-items:flex-start}
.tip-li svg{margin-top:2px}

/* Prototype-hulp */
.proto{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;gap:8px;align-items:center;padding:6px;border-radius:var(--sh-radius-full);background:var(--sh-foreground-neutral-prominent);box-shadow:var(--sh-levitation-2)}
.proto span{padding:0 8px 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.7)}
.proto button{min-height:32px;padding:0 12px;border:0;border-radius:var(--sh-radius-full);background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600}
.proto button:hover{background:rgba(255,255,255,.22)}
</style>
</head>

    h += '<button type="button" class="lp" data-a="el" data-v="'+id+'"'+(d?' disabled':'')+'><span style="width:32px;height:32px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;'+(d?'background:var(--sh-background-constructive);color:#fff':'background:var(--sh-background-primary-raised);color:var(--sh-foreground-primary-prominent)')+'">'+(d?ic('check',16,'stroke-width="3"'):ic('play',14))+'</span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span class="h5" style="font-size:14px">'+e.title+'</span><span class="label-sm faded">'+(d?'Afgerond':e.mins+' min · '+(id==='basis'?'aanbevolen voor iedereen':'nodig voor een skill'))+'</span></span>'+(d?'':ic('chevRight',16,'style="color:var(--sh-foreground-neutral-faded)"'))+'</button>';
  });
  h += '</section></aside></div>';
  return h;
}

function viewChat(){
  var h = '<div class="chat"><div class="chat__scroll" id="scroll" aria-live="polite">';
  S.msgs.forEach(function(m, idx){
    if (m.kind==='user') h += '<div class="bubble-out">'+esc(m.text)+'</div>';
    if (m.kind==='thinking') h += '<div class="msg-in"><span class="ai-avatar ai-avatar--thinking">'+ic('sparkle',16)+'</span><div class="msg-in__body">'+(m.tool?'<span class="tool">'+ic('loader',14,'class="spin" stroke-width="2.4"')+esc(m.tool.replace(/ (doorzocht|opgehaald|vergeleken)$/,''))+'…</span>':'')+'<span class="dots" aria-label="COAGPT denkt na"><i></i><i></i><i></i></span></div></div>';
    if (m.kind==='agent') h += '<div class="msg-in"><span class="ai-avatar">'+ic('sparkle',16)+'</span><div class="msg-in__body">'+(m.tool?'<span class="tool">'+ic('check',14,'stroke-width="2.6" style="color:var(--sh-background-constructive)"')+esc(m.tool)+'</span>':'')+'<div class="bubble-in msg-text">'+rich(m.text)+'</div>'+(m.src?'<span class="cite">'+ic('doc',12)+rich(m.src)+'</span>':'')+'<div class="feedback"><button type="button" class="sh-icon-btn" aria-label="Goed antwoord">'+ic('up',18)+'</button><button type="button" class="sh-icon-btn" aria-label="Slecht antwoord">'+ic('down',18)+'</button><button type="button" class="sh-icon-btn" aria-label="Opmerking">'+ic('comment',18)+'</button><button type="button" class="sh-icon-btn" aria-label="Kopiëren">'+ic('copy',18)+'</button></div></div></div>';
    if (m.kind==='gate'){
      var e = ELS[m.need];
      h += '<div class="msg-in"><span class="ai-avatar">'+ic('sparkle',16)+'</span><div class="msg-in__body"><div class="bubble-in msg-text">Dit doe ik graag voor je. Voor <strong>'+esc(m.skill)+'</strong> vraagt COA wel eerst een korte e-learning. Daarna staat deze skill direct voor je aan.</div>';
      h += '<div class="sh-alert"><div class="sh-alert__head"><span style="color:var(--sh-foreground-attention);margin-top:2px">'+ic('book',22)+'</span><div style="display:flex;flex-direction:column;gap:4px;flex:1"><span class="label-sm" style="font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sh-foreground-attention-prominent)">E-learning · '+e.mins+' minuten</span><span class="h5" style="font-size:17px;line-height:24px;color:var(--sh-foreground-attention-prominent)">'+e.title+'</span><span class="label" style="color:var(--sh-foreground-neutral-prominent)">'+e.desc+'</span></div></div>';
      if (S.done[m.need]) h += '<span class="sh-chip sh-chip--constructive" style="align-self:flex-start">'+ic('check',12,'stroke-width="3"')+'Afgerond</span>';
      else if (m.later) h += '<span class="label faded">Staat in je leerpad.</span>';
      else h += '<div class="wrap"><button type="button" class="sh-btn sh-btn--primary" data-a="el" data-v="'+m.need+'">'+ic('play',14)+'Start nu</button><button type="button" class="sh-btn sh-btn--secondary" data-a="later" data-v="'+idx+'">Later, zet hem in mijn leerpad</button></div>';
      h += '</div></div></div>';
    }
    if (m.kind==='tip'){
      h += '<div class="msg-in"><span class="ai-avatar"></span><div class="msg-in__body"><div class="bubble-in msg-text">Doe ik. Omdat dit je eerste keer is, eerst twee dingen die je moet weten.</div>';
      h += '<div class="insight" style="flex-direction:column;gap:12px"><span class="h5" style="font-family:var(--sh-font-body);font-weight:600;font-size:14px">Werken met COAGPT</span><div class="tip-li">'+ic('sparkle',18,'style="color:var(--sh-foreground-primary)"')+'<span class="label"><strong>Alles loopt via Sluis.</strong> Elk AI-verzoek van COAGPT, agents en apps gaat daar langs. Zo blijft het veilig en controleerbaar.</span></div><div class="tip-li">'+ic('doc',18,'style="color:var(--sh-foreground-primary)"')+'<span class="label"><strong>Controleer de bron.</strong> Bij elk antwoord zie je waar het vandaan komt. Jij beslist wat je ermee doet.</span></div>';
      h += m.done ? '<span class="sh-chip sh-chip--constructive" style="align-self:flex-start">'+ic('check',12,'stroke-width="3"')+'Basis afgerond</span>' : '<div class="wrap" style="gap:8px"><button type="button" class="sh-btn sh-btn--primary sh-btn--sm" data-a="tipok">Begrepen, ga verder</button><button type="button" class="sh-btn sh-btn--secondary sh-btn--sm" data-a="tipmore">'+ic('play',12)+'Meer uitleg (5 min)</button></div>';
      h += '</div></div></div>';
    }
    if (m.kind==='unlocked') h += '<div class="sh-alert sh-alert--ok">'+ic('check',18,'stroke-width="2.6"')+esc(m.text)+'</div>';
  });
  h += '</div><div class="chat__foot">'+composer(false)+'<p class="disclaimer">Alle AI-verzoeken lopen via Sluis. Controleer antwoorden altijd in de bron.</p></div></div>';
  return h;
}

function viewDrawer(){
  var e = ELS[S.el], n = e.slides.length, total = n+2, step = S.elStep;
  var isSlide = step<n, isQuiz = step===n, isDone = step>n;
  var pct = Math.round((Math.min(step, total-1))/(total-1)*100);
  var right = isQuiz && S.answer===e.quiz.c, wrong = isQuiz && S.answer!=null && S.answer!==e.quiz.c;
  var h = '<div class="scrim" data-a="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="el-title">';
  h += '<div class="drawer__head"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:6px"><span class="label-sm" style="font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sh-foreground-attention-prominent)">E-learning · '+e.mins+' minuten</span><h2 class="h3" id="el-title" tabindex="-1">'+e.title+'</h2></div><button type="button" class="sh-icon-btn" data-a="el-close" aria-label="Sluiten">'+ic('x',20)+'</button></div>';
  h += '<div class="sh-progress"><div class="sh-progress__track"><div class="sh-progress__fill'+(isDone?' sh-progress__fill--done':'')+'" style="width:'+pct+'%"></div></div><span class="sh-progress__pct">'+pct+'%</span></div></div>';
  h += '<div class="drawer__body">';
  if (isSlide){ var sl = e.slides[step]; h += '<div class="slide-hero"><span class="label-sm" style="font-weight:700;letter-spacing:.12em;color:#9fd3dc">DEEL '+(step+1)+' VAN '+n+'</span><span class="h2" style="color:#fff">'+sl.h+'</span></div><p style="margin:0;font-size:18px;line-height:30px;color:var(--sh-foreground-neutral-prominent)">'+sl.p+'</p>'; }
  if (isQuiz){
    h += '<span class="overline">Korte check</span><p class="h4" style="line-height:28px">'+e.quiz.q+'</p><div role="group" aria-label="Antwoorden" style="display:flex;flex-direction:column;gap:10px">';
    e.quiz.o.forEach(function(o,i){ var cls = S.answer===i ? (i===e.quiz.c?' ok':' no') : ''; h += '<button type="button" class="quiz-opt'+cls+'" data-a="ans" data-v="'+i+'" aria-pressed="'+(S.answer===i)+'"><span class="l">'+'ABC'[i]+'</span>'+o+'</button>'; });
    h += '</div>';
    if (right) h += '<div class="sh-alert sh-alert--ok" role="status" style="font-weight:500">Klopt. '+e.quiz.why+'</div>';
    if (wrong) h += '<div class="sh-alert" role="status" style="background:var(--sh-background-destructive-raised);color:var(--sh-foreground-destructive-prominent)">Nog niet helemaal. Kijk nog eens naar de vorige delen en probeer het opnieuw.</div>';
  }
  if (isDone){
    h += '<div style="display:flex;flex-direction:column;gap:16px;padding-top:24px"><span style="width:64px;height:64px;border-radius:999px;background:var(--sh-background-constructive-raised);color:var(--sh-foreground-constructive-prominent);display:flex;align-items:center;justify-content:center">'+ic('check',32,'stroke-width="2.6"')+'</span><h3 class="h2">Afgerond. Goed gedaan, '+esc(nameOr())+'.</h3><p class="lead">'+(S.pending?esc(S.pending.t)+' staat nu voor je aan. Ik ga direct verder met je vraag.':'Deze e-learning staat als afgerond in je leerpad. De bijbehorende skills zijn nu ontgrendeld.')+'</p></div>';
  }
  h += '</div><div class="drawer__foot"><div>'+((isSlide||isQuiz)&&step>0?'<button type="button" class="sh-btn sh-btn--secondary" data-a="el-back">Vorige</button>':'')+'</div>';
  if (isSlide) h += '<button type="button" class="sh-btn sh-btn--primary" data-a="el-next">Volgende</button>';
  if (isQuiz) h += '<button type="button" class="sh-btn sh-btn--primary" data-a="el-next"'+(right?'':' disabled style="opacity:.45;cursor:not-allowed"')+'>Afronden</button>';
  if (isDone) h += '<button type="button" class="sh-btn sh-btn--primary" data-a="el-finish">'+(S.pending?'Verder met '+esc(S.pending.t.toLowerCase()):'Terug naar mijn werkruimte')+'</button>';
  h += '</div></aside></div>';
  return h;
}

/* ---------- Render ---------- */
function render(focusSel){
  if (S.screen==='werkruimte' && !S.coachSeen && S.coach===0 && S.view==='vandaag') S.coach = 1;
  app.innerHTML = S.screen==='intake' ? viewIntake() : viewWork();
  var sc = document.getElementById('scroll'); if (sc) sc.lastElementChild && sc.lastElementChild.scrollIntoView({block:'end'});
  var ich = document.getElementById('ichat'); if (ich) ich.scrollTop = ich.scrollHeight;
  if (focusSel){ var f = document.querySelector(focusSel); if (f) f.focus({preventScroll:false}); }
}

/* ---------- Gedrag ---------- */
function replyFor(sk){
  var r = role(), apps = S.apps.length ? S.apps.join(' en ') : 'je apps';
  if (sk && sk.reply) return sk.reply;
  if (sk) return 'Ik pak "'+sk.t+'" voor je op. Ik gebruik daarvoor '+apps+' en wat ik weet van je werk als '+(r?r.title.toLowerCase():'medewerker')+'.\n\nHier is een eerste opzet: [eerste versie]\n\nBij elk punt staat de bron. Wil je dat ik ergens extra op let?';
  return 'Helder. Ik neem je profiel mee: '+(r?r.title+' bij '+r.dept:'je functie')+', met '+apps+'.\n\nZal ik eerst een korte aanpak voorstellen, of wil je dat ik direct begin?';
}
function findSkill(t){ var r=role(); if (!r) return null; for (var i=0;i<r.skills.length;i++) if (r.skills[i].t===t) return r.skills[i]; return null; }
function answer(sk){
  var thinking = { kind:'thinking', tool: sk && sk.tool ? sk.tool : (S.apps.length?'Zoekt in '+S.apps[0]:'') };
  S.msgs.push(thinking); S.busy = true; render();
  setTimeout(function(){
    var i = S.msgs.indexOf(thinking); if (i<0) return;
    S.msgs.splice(i,1,{ kind:'agent', text:replyFor(sk), src: sk ? (sk.src||'') : '', tool: sk && sk.tool ? sk.tool : '' });
    S.busy = false; render();
  }, 1300);
}
function send(text, sk){
  text = String(text||'').trim(); if (!text || S.busy) return;
  sk = sk || findSkill(text);
  S.ob.ask = true; S.msgs.push({ kind:'user', text:text }); S.draft = ''; S.view = 'gesprek'; S.doc = null; window.scrollTo(0,0);
  if (sk && sk.need && !S.done[sk.need]){ S.msgs.push({ kind:'gate', need:sk.need, skill:sk.t }); S.pending = sk; render(); return; }
  answer(sk);
}
var toastTimer=null;
function toast(t){ S.toast=t; render(); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ S.toast=''; var el=document.querySelector('.sh-toast'); if (el) el.remove(); }, 2600); }
function finishEl(){
  var id = S.el; S.done[id] = true; S.el = null; S.elStep = 0; S.answer = null;
  if (S.pending){ var sk = S.pending; S.pending = null; S.view = 'gesprek'; S.msgs.push({ kind:'unlocked', text: ELS[id].title+' afgerond. '+sk.t+' staat nu voor je aan.' }); answer(sk); return; }
  render();
}

var A = {
  exp:function(v){ S.exp=v; advance(); },
  role:function(v){ var r; ROLES.forEach(function(x){ if (x.id===v) r=x; }); S.role=v; S.apps=r.apps.slice(); S.topics=[]; S.goals=[]; advance(); },
  topic:function(v){ toggle('topics',v); render(); },
  app:function(v){ toggle('apps',v); render(); },
  goal:function(v){ toggle('goals',v); render(); },
  adv:function(){ advance(); },
  edit:function(v){ clearInterval(timer); S.istep=+v; S.build=0; render(); },
  firsttask:function(){ var a=role().attention[0], sk=firstSkill(); S.screen='werkruimte'; S.view='gesprek'; S.ob.ask=true; S.firstTask=sk; S.msgs=[{kind:'user',text:'Help me met: '+a.t},{kind:'tip'}]; render(); window.scrollTo(0,0); },
  tour:function(){ S.screen='werkruimte'; S.view='vandaag'; S.coach=0; render('#coach-t'); window.scrollTo(0,0); },
  tipok:function(){ S.done.basis=true; S.msgs.forEach(function(m){ if (m.kind==='tip') m.done=true; }); var sk=S.firstTask; S.firstTask=null; answer(sk); },
  tipmore:function(){ S.msgs.forEach(function(m){ if (m.kind==='tip') m.done=true; }); S.pending=S.firstTask; S.firstTask=null; A.el('basis'); },
  coachnext:function(){ S.coach++; if (S.coach>COACH.length){ S.coach=-1; S.coachSeen=true; } render('#coach-t'); },
  coachskip:function(){ S.coach=-1; S.coachSeen=true; render(); },
  'cl-ask':function(){ if (S.ob.ask) return; S.view='vandaag'; render('#prompt'); },
  'cl-basis':function(){ if (S.done.basis) return; A.el('basis'); },
  'cl-doc':function(){ if (!S.ob.doc) A.nav('documenten'); },
  'cl-agent':function(){ if (!S.ob.agent) A.nav('agents'); },
  'cl-app':function(){ if (!S.ob.app) A.nav('apps'); },
  'cl-hide':function(){ S.ob.hidden=true; render(); },
  openapp:function(v){ S.ob.app=true; toast(v+' opent zonder opnieuw in te loggen'); },
  home:function(){ S.msgs=[]; S.pending=null; S.busy=false; S.view='vandaag'; render('#prompt'); },
  nav:function(v){ S.view=v; S.q=''; S.doc=null; if (v==='gesprek' && !S.msgs.length) S.view='vandaag'; render(v==='kennis'||v==='skills'?'#filter':'#page-title'); window.scrollTo(0,0); },
  tf:function(v){ S.taskFilter=v; render(); },
  taskdone:function(v){ S.doneTasks[v]=true; toast('Taak afgerond'); },
  ask:function(v){ if (v) send(v); },
  oldchat:function(v){ var p=role().prompts[+v]; S.msgs=[{kind:'user',text:p},{kind:'agent',text:replyFor(null),src:''}]; S.view='gesprek'; render(); window.scrollTo(0,0); },
  doc:function(v){ S.doc=+v; render('#doc-title'); },
  docclose:function(){ S.doc=null; render(); },
  docsum:function(){ var d=(DOCS[role().id]||[])[S.doc]; var name=d[0]; var sk={ t:'Document samenvatten', need:d[4]||null, src:'DOCK · '+name, tool:'Document in DOCK gelezen', reply:'Samenvatting van "'+name+'":\n\n• Doel: [doel]\n• Belangrijkste afspraken: [afspraken]\n• Termijnen: [termijnen]\n\nBij elk punt staat de pagina. Zal ik de afspraken als taken klaarzetten?' }; S.doc=null; S.ob.doc=true; send('Vat samen: '+name.replace(/\[|\]/g,''), sk); },
  agent:function(v,el){ S.agents[v]=el.checked; if (el.checked) S.ob.agent=true; toast(v+(el.checked?' staat aan':' is gepauzeerd')); },
  toast:function(v){ toast(v); },
  req:function(v){ S.requested[v]=true; toast('Toegang tot '+v+' aangevraagd'); },
  anyskill:function(v){ var x=allSkills()[+v]; send(x.k.t, x.k); },
  tpl:function(v){ var t=TEMPLATES[+v]; send('Gebruik de template: '+t[0], { t:t[0], need:null, src:'Templates · '+t[0], tool:'', reply:'Ik heb de template "'+t[0]+'" voor je klaargezet. Een paar vragen om hem goed in te vullen:\n\n1. Voor wie is het bedoeld?\n2. Wat is de aanleiding?\n3. Is er een deadline?\n\nJe kunt ook een document uit DOCK toevoegen, dan haal ik de gegevens daaruit.' }); },
  kb:function(v){ var k=KENNIS[+v]; send('Wat staat er in "'+k[0]+'"?', { t:k[0], need:null, src:'Kennis · '+k[0], tool:'Kennis doorzocht', reply:'In "'+k[0]+'" staat in het kort:\n\n• [kernpunt]\n• [kernpunt]\n• [kernpunt]\n\nWil je dat ik het toepas op jouw situatie?' }); },
  more:function(){ S.showAll=!S.showAll; render(); },
  profile:function(){ clearInterval(timer); S.screen='intake'; S.istep=2; S.build=0; render(); window.scrollTo(0,0); },
  skill:function(v){ var k=role().skills[+v]; send(k.t,k); },
  prompt:function(v){ send(role().prompts[+v]); },
  att:function(v){ send('Help me met: '+role().attention[+v].t); },
  send:function(){ var t=document.getElementById('prompt'); send(t?t.value:S.draft); },
  el:function(v){ S.el=v; S.elStep=0; S.answer=null; render('#el-title'); },
  'el-next':function(){ S.elStep++; S.answer = S.answer; render(); },
  'el-back':function(){ S.elStep=Math.max(0,S.elStep-1); S.answer=null; render(); },
  'el-close':function(){ S.el=null; S.elStep=0; S.answer=null; render(); },
  'el-finish':finishEl,
  ans:function(v){ S.answer=+v; render(); },
  later:function(v){ var m=S.msgs[+v]; if (m) m.later=true; S.pending=null; S.msgs.push({ kind:'agent', text:'Prima. De e-learning staat in je leerpad. Zal ik intussen iets anders voor je doen?' }); render(); },
  scrim:function(v,el,e){ if (e.target===el) A['el-close'](); },
  reset:function(){ clearInterval(timer); S=fresh(); render('#naam'); window.scrollTo(0,0); },
  skip:function(){ clearInterval(timer); S=fresh(); Object.assign(S,{ screen:'werkruimte', name:'Thijs', exp:'1 tot 5 jaar', role:'contract', apps:['DOCK','FIKS'], topics:['Contractverlengingen','Keuringen op locaties'], goals:['Minder zoeken in documenten','Geen keuring meer laten verlopen'], view:'vandaag', istep:5, build:4 }); render(); window.scrollTo(0,0); }
};

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-a]'); if (!b) return;
  if (b.disabled) return;
  var a = b.getAttribute('data-a');
  if (a==='scrim'){ if (e.target===b) A['el-close'](); return; }
  if (a==='docclose-scrim'){ if (e.target===b) A.docclose(); return; }
  if (A[a]) A[a](b.getAttribute('data-v'), b, e);
});
document.addEventListener('submit', function(e){
  if (e.target.getAttribute('data-form')==='name'){ e.preventDefault(); var v=(document.getElementById('naam').value||'').trim(); if (!v){ S.nameErr=true; render('#naam'); return; } S.name=v; S.nameErr=false; advance(); }
});
document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id==='naam'){ S.name=e.target.value; if (S.nameErr && S.name.trim()){ S.nameErr=false; var dsc=document.getElementById('naam-desc'); if (dsc){ dsc.className='sh-desc'; dsc.textContent='Alleen je voornaam is genoeg.'; } } var p=document.getElementById('preview'); if (p) p.outerHTML = preview(); }
  if (id==='note') S.note=e.target.value;
  if (id==='prompt') S.draft=e.target.value;
  if (id==='filter'){ S.q=e.target.value; var box=document.getElementById('results'); var q=S.q.toLowerCase(); if (box) box.innerHTML = e.target.getAttribute('data-filter')==='skills' ? skillResults(role(), allSkills(), q) : kennisResults(q); }
});
document.addEventListener('keydown', function(e){
  if (e.target.id==='prompt' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(e.target.value); }
  if (e.key==='Escape' && S.el){ A['el-close'](); return; }
  if (e.key==='Escape' && S.doc!=null){ A.docclose(); return; }
  if (e.key==='/' && S.screen==='werkruimte' && !/INPUT|TEXTAREA/.test(e.target.tagName)){ e.preventDefault(); A.nav('kennis'); }
});

render();
</script>
